plugins {
    id 'com.android.application'
    id 'im.fir.plugin.gradle'
}

fir {
   apiToken project.findProperty('publish.fir.key') ?: 'c5cddea79fbc9176a98e216c6f154022'
   changeLog 'Test Fir Publisher'
}

android {
    compileSdk 33
    namespace "mobi.cangol.mobile.fir"
    defaultConfig {
        applicationId "mobi.cangol.mobile.utils"
        targetSdk 33
        multiDexEnabled false
        minSdkVersion 14
        versionCode 2
        versionName "1.0.1"
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
    lint {
        abortOnError false
    }
    signingConfigs {
        debug {
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
