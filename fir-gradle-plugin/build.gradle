plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '0.18.0'
}

repositories {
    google()
    mavenCentral()
    mavenLocal()
}

// 读取上级目录的gradle.properties文件
def properties = new Properties()
properties.load(file('../gradle.properties').newInputStream())
properties.each { key, value -> project.ext.set(key, value) }

apply from: '../maven_push.gradle'

gradlePlugin {
    plugins {
        firPlugin {
            id = 'im.fir.plugin.gradle'
            displayName = POM_NAME
            description = POM_DESCRIPTION
            implementationClass = 'im.fir.gradle.FirPublisherPlugin'
        }
    }
}
dependencies {
    implementation gradleApi()
    implementation localGroovy()
    implementation 'net.dongliu:apk-parser:2.6.2'
    implementation 'org.apache.httpcomponents:httpclient:4.5.6'
    implementation 'org.apache.httpcomponents:httpmime:4.5.6'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'commons-io:commons-io:2.6'
    compileOnly "com.android.tools.build:gradle:$android_gradle"
}

